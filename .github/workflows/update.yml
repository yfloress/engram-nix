name: Update engram

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Allow the job to commit the bump
permissions:
  contents: write

concurrency:
  group: update-engram
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Upstream also tags pi-v* and v2.0.0-rc.* in the same repo; the atom
      # feed only shows the last 10, so use the releases API and match vX.Y.Z.
      - name: Bump engram to latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          nix run nixpkgs#nix-update -- --flake --commit
          --version=stable --use-github-releases
          --version-regex '^v(\d+\.\d+\.\d+)$' engram

      - name: Push
        run: git push
